<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <title>Manejo de eventos</title>
</head>
<body>
    <!--
    Hacer click -> click
    Escribir -> keyup, keydown, keypress
    Pasar el mouse -> mouseenter, mouseover
    Enfoca un campo -> focus
    Salir de un campo -> blur
    Enviar un formulario -> submit
    Cambiar el valor de un campo -> change

    $(selector).on("evento", handler);
    $(selector).click(handler);
    $(selector).focus(handler);
    
    -->
</body>
</html>
